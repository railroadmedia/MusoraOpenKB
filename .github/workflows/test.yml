name: Tests

# Runs the pytest suite on every push and pull request. Real-LLM tests are
# marked `llm` and excluded by default (pyproject `addopts = "-m 'not llm'"`),
# so CI stays deterministic and offline.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.2.2
        with:
          fetch-depth: 0   # hatch-vcs derives the version from tags at install time

      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest
